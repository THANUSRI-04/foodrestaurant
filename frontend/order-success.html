<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmation | Food in Forest</title>
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loading-spinner" class="loading-overlay">
    <div class="spinner"></div>
  </div>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">
        <span class="brand-icon">🌲</span>
        <span class="brand-text">Food in Forest</span>
      </a>

      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="menu.html" class="nav-link">Menu</a></li>
        <li><a href="orders.html" class="nav-link">My Orders</a></li>
      </ul>

      <div class="nav-actions">
        <a href="cart.html" class="cart-nav-btn" aria-label="Shopping Cart">
          🛒
          <span class="cart-badge" id="cart-count-badge">0</span>
        </a>
        <div id="nav-auth-container"></div>
        <button class="mobile-nav-toggle" id="mobile-drawer-toggle" aria-label="Open menu">☰</button>
      </div>
    </div>
  </header>

  <!-- Mobile Drawer Navigation -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <div class="mobile-drawer" id="mobile-drawer">
    <div class="mobile-drawer-header">
      <div class="nav-brand"><span>🌲</span> <span>Food in Forest</span></div>
      <button class="mobile-drawer-close" id="mobile-drawer-close">&times;</button>
    </div>
    <ul class="mobile-nav-links">
      <li><a href="index.html" class="mobile-nav-link">Home</a></li>
      <li><a href="menu.html" class="mobile-nav-link">Explore Menu</a></li>
      <li><a href="cart.html" class="mobile-nav-link">My Cart (<span id="mobile-cart-count-badge">0</span>)</a></li>
      <li><a href="orders.html" class="mobile-nav-link">My Orders</a></li>
    </ul>
    <div class="mobile-nav-auth" id="mobile-nav-auth"></div>
  </div>

  <!-- Main Order Success Section -->
  <section class="section" style="padding: 4rem 0 6rem 0;">
    <div class="container">
      <!-- Container populated dynamically by orders.js with real-time Firebase listener -->
      <div id="order-success-container">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </section>


  <!-- Firebase JavaScript SDK (v9 compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- Application Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/orders.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const toggle = document.getElementById('mobile-drawer-toggle');
      const drawer = document.getElementById('mobile-drawer');
      const overlay = document.getElementById('drawer-overlay');
      const closeBtn = document.getElementById('mobile-drawer-close');

      if (toggle && drawer && overlay) {
        toggle.addEventListener('click', () => {
          drawer.classList.add('drawer-open');
          overlay.classList.add('show');
        });
      }

      const closeDrawer = () => {
        drawer?.classList.remove('drawer-open');
        overlay?.classList.remove('show');
      };

      closeBtn?.addEventListener('click', closeDrawer);
      overlay?.addEventListener('click', closeDrawer);
    });
  </script>
</body>
</html>
