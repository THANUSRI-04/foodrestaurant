<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Admin Login | Food in Forest</title>
  
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body style="background: var(--color-forest-dark);">

  <div class="auth-page-wrapper">
    <div class="auth-card" style="box-shadow: var(--shadow-forest);">
      <div class="auth-card-header">
        <div style="display: flex; justify-content: center; margin-bottom: 0.75rem;">
          <svg class="brand-logo-svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-gold-accent);">
            <path d="m8 14 4-8 4 8H8z"/>
            <path d="m5 18 7-8 7 8H5z"/>
            <path d="M12 18v4"/>
          </svg>
        </div>
        <h2>Hotel Management Portal</h2>
        <p>Restricted access for authorized resort administrators.</p>
        <div style="margin-top: 0.5rem;">
          <span class="admin-badge-label">Admin Authentication</span>
        </div>
      </div>

      <form id="admin-login-form">
        <div class="form-group">
          <label for="admin-email">Administrator Email</label>
          <input type="email" id="admin-email" class="form-control" placeholder="admin@foodinforest.com" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="admin-password">Administrator Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="admin-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="password-toggle-btn" data-target="admin-password" title="Show/Hide password" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>


        <button type="submit" id="admin-login-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">
          Access Admin Dashboard &rarr;
        </button>
      </form>

      <div class="auth-footer-links">
        <p><a href="../index.html" style="color: var(--color-text-muted);">&larr; Back to Guest Website</a></p>
      </div>
    </div>
  </div>

  <!-- Firebase JavaScript SDK (v9 compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- Application Scripts -->
  <script src="../js/firebase-config.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/firebase.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
